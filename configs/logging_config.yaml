version: 1
disable_existing_loggers: false

formatters:
  info_formatter:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

  error_formatter:
    format: "%(asctime)s - %(name)s - %(levelname)s - [Path: %(pathname)s | Line: %(lineno)d | Func: %(funcName)s] - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: info_formatter
    stream: ext://sys.stdout

  info_file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: info_formatter
    filename: "logs/info.log"
    maxBytes: 10485760  # 10 MB
    backupCount: 2
    encoding: "utf-8"

  error_file:
    class: logging.handlers.RotatingFileHandler
    level: ERROR
    formatter: error_formatter
    filename: "logs/error.log"
    maxBytes: 10485760  # 10 MB
    backupCount: 2
    encoding: "utf-8"

loggers:
  utils:
    level: DEBUG
    handlers: [console, info_file, error_file]
    propagate: false

  streamlit_app:
    level: INFO
    handlers: [console, info_file, error_file]
    propagate: false

root:
  level: WARNING
  handlers: [console]